# Publishes a release when a version tag is pushed: git tag v0.25.0 && git push origin v0.25.0
# Checks the tag against package.json, builds, tests, packages for Windows x64, then publishes to
# the VS Code Marketplace (VSCE_PAT) and Open VSX (OVSX_PAT, skipped while that secret is not set),
# publishes the MCP server and CLI to npm as @edgemodders/edgedeck-mcp at the same version (NPM_TOKEN),
# and attaches the .vsix and the Nexus Mods zip (scripts/nexus-zip.mjs, uploaded to Nexus by hand) to a
# GitHub release. The tokens are Edgemodders organisation secrets.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: The tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke

      - name: Package
        run: npx vsce package --no-dependencies --target win32-x64 --readme-path docs/marketplace.md --out "dist/edgedeck-${VERSION}.vsix"

      - name: Nexus zip
        run: node scripts/nexus-zip.mjs

      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # --skip-duplicate: a re-run of a release that got partway does not fail on what is already out.
        run: npx vsce publish --packagePath "dist/edgedeck-${VERSION}.vsix" --skip-duplicate

      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "::warning::OVSX_PAT is not set; not published to Open VSX"
            exit 0
          fi
          npx ovsx publish "dist/edgedeck-${VERSION}.vsix" --pat "${OVSX_PAT}" --skip-duplicate

      - name: npm (@edgemodders/edgedeck-mcp)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN is not set; the MCP package is not published"
            exit 0
          fi
          node scripts/npm-package.mjs
          if npm view "@edgemodders/edgedeck-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@edgemodders/edgedeck-mcp ${VERSION} is already on npm"
            exit 0
          fi
          # ./ matters: "dist/npm" alone reads as a GitHub repository.
          npm publish ./dist/npm --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8');const m=s.split(/^## /m).find(p=>p.startsWith(process.argv[1]+' '));console.log(m?m.split('\n').slice(1).join('\n').trim():'')" "${VERSION}")
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; adding the Nexus zip if it is missing"
            gh release upload "${GITHUB_REF_NAME}" "dist/EDGEdeck-${VERSION}-nexus.zip" --clobber
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" "dist/edgedeck-${VERSION}.vsix" "dist/EDGEdeck-${VERSION}-nexus.zip" --title "EDGEdeck ${VERSION}" --notes "${notes}"
