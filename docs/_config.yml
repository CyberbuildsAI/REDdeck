# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# design.html is a standalone page and is served as-is.
# Built and deployed by .github/workflows/pages.yml.

title: REDdeck
url: https://cyberbuildsai.github.io
baseurl: /REDdeck
repo: https://github.com/CyberbuildsAI/REDdeck

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: Design
    url: /design.html
  - title: Dev setup
    url: /dev-setup.html
